{% extends "base.html" %}
{% block content %}
<h1>Add a printer</h1>
{% if not person.latitude %}
  <div class="flash">Set your <a href="{{ url_for('profile') }}">location</a> first — new printers default to it, and you can adjust below.</div>
{% endif %}
<form method="post" class="card">
  <label>Name</label>
  <input type="text" name="name" required placeholder="e.g. Garage Bambu A1">

  <label>Description</label>
  <textarea name="description" rows="2"></textarea>

  <label>Technology</label>
  <select name="technology" required>
    {% for t in technologies %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
  </select>

  <label>Materials supported</label>
  <div class="checkboxes">
    {% for m in materials %}
      <label><input type="checkbox" name="materials" value="{{ m }}"> {{ m }}</label>
    {% endfor %}
  </div>

  <label>Nozzle diameter (mm, if FDM)</label>
  <select name="nozzle_diameter_mm">
    <option value="">N/A</option>
    {% for n in nozzle_diameters %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
  </select>

  <label>Build volume (mm)</label>
  <div style="display:flex; gap:0.5rem;">
    <input type="number" name="build_volume_x_mm" placeholder="X" required min="1">
    <input type="number" name="build_volume_y_mm" placeholder="Y" required min="1">
    <input type="number" name="build_volume_z_mm" placeholder="Z" required min="1">
  </div>

  <label>Max nozzle temp (°C, optional)</label>
  <input type="number" name="max_nozzle_temp_c">

  <div class="checkboxes" style="margin-top:0.8rem;">
    <label><input type="checkbox" name="heated_bed"> Heated bed</label>
    <label><input type="checkbox" name="enclosed"> Enclosed chamber</label>
  </div>

  <label>Latitude</label>
  <input type="text" name="latitude" value="{{ person.latitude or '' }}" required>
  <label>Longitude</label>
  <input type="text" name="longitude" value="{{ person.longitude or '' }}" required>

  <button type="submit">Add printer</button>
</form>
{% endblock %}
