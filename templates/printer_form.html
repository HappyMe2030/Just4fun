{% extends "base.html" %}
{% block content %}
<h1>{{ "Edit printer" if printer else "Add a printer" }}</h1>
{% if not printer and not person.latitude %}
  <div class="flash">Set your <a href="{{ url_for('profile') }}">location</a> first — new printers default to it, and you can adjust below.</div>
{% endif %}
<form method="post" class="card">
  <label>Name</label>
  <input type="text" name="name" required placeholder="e.g. Garage Bambu A1" value="{{ printer.name if printer else '' }}">

  <label>Description</label>
  <textarea name="description" rows="2">{{ printer.description if printer else '' }}</textarea>

  <label>Technology</label>
  <select name="technology" required>
    {% for t in technologies %}
      <option value="{{ t }}" {{ "selected" if printer and printer.technology == t }}>{{ t }}</option>
    {% endfor %}
  </select>

  <label>Materials supported</label>
  <div class="checkboxes">
    {% for m in materials %}
      <label><input type="checkbox" name="materials" value="{{ m }}"
        {{ "checked" if printer and m in printer.materials }}> {{ m }}</label>
    {% endfor %}
  </div>

  <label>Nozzle diameter (mm, if FDM)</label>
  <select name="nozzle_diameter_mm">
    <option value="">N/A</option>
    {% for n in nozzle_diameters %}
      <option value="{{ n }}" {{ "selected" if printer and printer.nozzle_diameter_mm and printer.nozzle_diameter_mm|float == n }}>{{ n }}</option>
    {% endfor %}
  </select>

  <label>Build volume (mm)</label>
  <div style="display:flex; gap:0.5rem;">
    <input type="number" name="build_volume_x_mm" placeholder="X" required min="1" value="{{ printer.build_volume_x_mm if printer else '' }}">
    <input type="number" name="build_volume_y_mm" placeholder="Y" required min="1" value="{{ printer.build_volume_y_mm if printer else '' }}">
    <input type="number" name="build_volume_z_mm" placeholder="Z" required min="1" value="{{ printer.build_volume_z_mm if printer else '' }}">
  </div>

  <label>Max nozzle temp (°C, optional)</label>
  <input type="number" name="max_nozzle_temp_c" value="{{ printer.max_nozzle_temp_c if printer and printer.max_nozzle_temp_c else '' }}">

  <div class="checkboxes" style="margin-top:0.8rem;">
    <label><input type="checkbox" name="heated_bed" {{ "checked" if printer and printer.heated_bed }}> Heated bed</label>
    <label><input type="checkbox" name="enclosed" {{ "checked" if printer and printer.enclosed }}> Enclosed chamber</label>
  </div>

  <label>Address</label>
  <input type="text" name="address" id="address-field" placeholder="e.g. 123 Main St, Springfield"
         value="{{ printer.address if printer else (person.address or '') }}">
  <button type="button" id="geocode-btn" class="secondary">Find this address</button>
  <button type="button" id="locate-btn" class="secondary">Use my current location instead</button>
  <p id="geocode-status" class="muted"></p>

  <input type="hidden" name="latitude" id="lat-field" value="{{ printer.latitude if printer else (person.latitude or '') }}">
  <input type="hidden" name="longitude" id="lng-field" value="{{ printer.longitude if printer else (person.longitude or '') }}">

  <button type="submit">{{ "Save changes" if printer else "Add printer" }}</button>
</form>

<script>
const statusEl = document.getElementById('geocode-status');
const latField = document.getElementById('lat-field');
const lngField = document.getElementById('lng-field');
const addressField = document.getElementById('address-field');

document.getElementById('geocode-btn').addEventListener('click', async function () {
  const address = addressField.value.trim();
  if (!address) { statusEl.textContent = 'Enter an address first.'; return; }
  statusEl.textContent = 'Looking up address…';
  try {
    const res = await fetch('/geocode?address=' + encodeURIComponent(address));
    const data = await res.json();
    if (!res.ok || data.error) {
      statusEl.textContent = data.error || 'Could not find that address.';
      return;
    }
    latField.value = data.lat;
    lngField.value = data.lng;
    statusEl.textContent = 'Found: ' + data.display_name;
  } catch (e) {
    statusEl.textContent = 'Something went wrong looking up that address.';
  }
});

document.getElementById('locate-btn').addEventListener('click', function () {
  if (!navigator.geolocation) {
    statusEl.textContent = 'Geolocation is not supported by your browser.';
    return;
  }
  statusEl.textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(function (pos) {
    latField.value = pos.coords.latitude;
    lngField.value = pos.coords.longitude;
    addressField.value = '';
    statusEl.textContent = 'Location found.';
  }, function (err) {
    statusEl.textContent = 'Could not get location: ' + err.message;
  });
});

document.querySelector('form').addEventListener('submit', function (e) {
  if (!latField.value || !lngField.value) {
    e.preventDefault();
    statusEl.textContent = 'Find an address or use your current location first.';
  }
});
</script>
{% endblock %}
