{% extends "base.html" %}
{% block content %}
<h1>{{ t('review.title') }}</h1>
<p class="muted">{{ t('review.subtitle', project=order.project_title, printer=order.printer_name) }}</p>

{% for target in targets %}
  <div class="card">
    <h3>{{ target.label }}</h3>
    <form method="post" action="{{ url_for('submit_review', order_id=order.id, target_type=target.type) }}">
      <label>{{ t('review.rating_label') }}</label>
      <select name="rating" required>
        <option value="" disabled {{ "" if target.existing else "selected" }}>{{ t('review.choose_rating') }}</option>
        {% for n in [5,4,3,2,1] %}
          <option value="{{ n }}" {{ "selected" if target.existing and target.existing.rating == n }}>{{ n }} {{ t('review.star_singular') if n == 1 else t('review.star_plural') }}</option>
        {% endfor %}
      </select>

      <label>{{ t('review.comment_label') }}</label>
      <textarea name="comment" rows="3">{{ target.existing.comment if target.existing else "" }}</textarea>

      <button type="submit">{{ t('review.update') if target.existing else t('review.submit') }}</button>
    </form>
  </div>
{% endfor %}

<a class="btn secondary" href="{{ url_for('list_orders') }}">{{ t('review.back_to_orders') }}</a>
{% endblock %}
